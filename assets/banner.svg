<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="radarBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatNode1 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(4px); }
      }
      @keyframes floatNode2 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(7px) translateX(-5px); }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes titleGlow {
        0%, 100% { filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4)); }
        50% { filter: drop-shadow(0 0 24px rgba(129, 140, 248, 0.7)); }
      }
      .radar-sweep {
        transform-origin: 980px 180px;
        animation: radarSweep 8s linear infinite;
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite;
      }
      .node-1 { animation: floatNode1 4s ease-in-out infinite; }
      .node-2 { animation: floatNode2 5s ease-in-out infinite; }
      .flow-line {
        stroke-dasharray: 8 12;
        animation: streamFlow 2s linear infinite;
      }
      .title-text {
        animation: titleGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Grid lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Decorative Radar Screen on Right -->
  <g opacity="0.85">
    <!-- Radar concentric circles -->
    <circle cx="980" cy="180" r="140" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="980" cy="180" r="100" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="980" cy="180" r="60" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="980" cy="180" r="20" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Crosshairs -->
    <line x1="840" y1="180" x2="1120" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="980" y1="40" x2="980" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" />

    <!-- Radar Scanner Cone -->
    <g class="radar-sweep">
      <path d="M980 180 L1120 180 A140 140 0 0 0 1079 81 Z" fill="url(#radarBeam)" />
      <line x1="980" y1="180" x2="1120" y2="180" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    </g>

    <!-- Radar Blips / Suspicious Transaction Nodes -->
    <g class="node-1">
      <circle cx="1040" cy="120" r="4" fill="#f43f5e" filter="url(#glow)" />
      <circle cx="1040" cy="120" r="10" fill="none" stroke="#f43f5e" stroke-width="1" class="node-pulse" />
      <text x="1052" y="124" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">FLAGGED [AML]</text>
    </g>

    <g class="node-2">
      <circle cx="920" cy="220" r="4" fill="#10b981" filter="url(#glow)" />
      <circle cx="920" cy="220" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6" />
      <text x="850" y="224" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">CLEARED</text>
    </g>

    <g class="node-1">
      <circle cx="1020" cy="250" r="3.5" fill="#fbbf24" filter="url(#glow)" />
      <text x="1032" y="254" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">REVIEW</text>
    </g>
  </g>

  <!-- Network Connection Vectors -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 520 180 C 650 180, 750 120, 840 180" class="flow-line" />
    <path d="M 520 220 C 620 250, 720 260, 840 220" stroke="#818cf8" stroke-opacity="0.2" class="flow-line" />
  </g>

  <!-- Left Content: Title & Badges -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 52)">
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" class="node-pulse" />
      <text x="28" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED COMPLIANCE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5" class="title-text">
      Awesome Transaction Monitoring
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      AML Detection • Real-Time Fraud Prevention • Sanctions Screening • Case Management
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Enterprise SaaS</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="145" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="156" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Open-Source AML</text>

      <!-- Pill 3 -->
      <rect x="299" y="0" width="140" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="313" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 Rules &amp; ML Engines</text>

      <!-- Pill 4 -->
      <rect x="451" y="0" width="130" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="465" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔍 Real-Time Alerts</text>
    </g>

    <!-- Live Status Strip -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="580" height="36" rx="8" fill="#0c1322" stroke="#1e293b" stroke-width="1" />
      <circle cx="20" cy="18" r="4" fill="#10b981" class="node-pulse" />
      <text x="34" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan fill="#38bdf8" font-weight="600">Continuous Monitoring:</tspan> Transaction Screening • Behavior Profiling • SAR Reporting
      </text>
    </g>
  </g>
</svg>